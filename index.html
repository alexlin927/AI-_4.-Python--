<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1a32"><title>Python 第四單元｜統計處理與結果評估</title>
<style>
:root{--bg:#0a1426;--panel:#13243d;--panel2:#182e49;--ink:#f4f8ff;--muted:#adbed5;--line:#344861;--blue:#70b7ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Noto Sans TC",Arial,sans-serif;color:var(--ink)}button{font:inherit;cursor:pointer;color:inherit}button:focus-visible{outline:3px solid #ffe38a;outline-offset:2px}.shell{max-width:1500px;margin:auto;padding:14px clamp(10px,2.2vw,32px) 36px}.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}.brand{font-size:clamp(15px,1.5vw,22px);font-weight:800;letter-spacing:.02em}.sub{font-size:12px;font-weight:500;color:var(--muted);margin-top:3px}.actions,.pager{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--panel);padding:9px 13px;border-radius:10px;white-space:nowrap}.btn:hover{background:#24415d}.btn.primary{background:#1768b5;border-color:#2985d5}.btn:disabled{opacity:.35;cursor:not-allowed}.slide{margin:auto;width:100%;max-width:1330px;aspect-ratio:16/9;background:#ffffff;box-shadow:0 16px 54px #0009;position:relative;overflow:hidden;border-radius:5px}.slide img{display:block;width:100%;height:100%;object-fit:contain}.slide img:not([src]){display:none}.slide-no{position:absolute;bottom:9px;right:12px;background:#001b37a8;color:white;font-size:12px;padding:4px 9px;border-radius:6px}.controls{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:16px auto;max-width:1330px;flex-wrap:wrap}.count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}.notes{max-width:1330px;margin:16px auto 0;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}.notes-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);font-weight:750}.note-content{padding:17px 20px;white-space:pre-wrap;line-height:1.95;font-size:clamp(15px,1.2vw,19px)}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#020912ee;z-index:15;overflow:auto;padding:22px}.modal-bar{display:flex;justify-content:space-between;align-items:center;max-width:1320px;margin:0 auto 18px}.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:15px;max-width:1320px;margin:auto}.tile{background:var(--panel);border:1px solid var(--line);padding:7px;border-radius:10px;text-align:left}.tile:hover,.tile.selected{border-color:var(--blue)}.tile img{width:100%;aspect-ratio:16/9;object-fit:contain;background:white}.tile span{display:block;padding:4px 3px;font-size:13px}.help{color:var(--muted);font-size:12px;margin-top:10px;text-align:center}.fs-stage{background:#000}@media(max-width:720px){.shell{padding:10px 8px 24px}.brand{font-size:16px}.sub{font-size:11px}.btn{padding:8px 10px;font-size:13px}.slide{border-radius:0}.controls{justify-content:center}.notes-head{padding:12px}.note-content{padding:14px;font-size:15px}}
</style></head><body>
<div class="shell"><header class="bar"><div><div class="brand">Python 第四單元｜統計處理與結果評估</div><div class="sub">國立臺灣師範大學 · 化學系 · 16:9 網路教學投影片</div></div><div class="actions"><button class="btn" id="gridBtn">▦ 頁面總覽</button><button class="btn" id="notesBtn" aria-pressed="false">▤ 顯示講稿</button><button class="btn" id="fullBtn">⛶ 全螢幕</button></div></header>
<main><div class="slide" id="stage"><img id="slideImage" alt="教學投影片"><span class="slide-no" id="slideNum"></span></div><div class="controls"><div class="pager"><button id="prev" class="btn">← 上一頁</button><button id="next" class="btn primary">下一頁 →</button></div><div class="count" id="count"></div><div class="pager"><button class="btn" id="first">第一頁</button><button class="btn" id="last">最後一頁</button></div></div><section id="notes" class="notes hidden"><div class="notes-head"><span id="notesTitle">教師講稿</span><button class="btn" id="hideNotes">收起講稿</button></div><div class="note-content" id="noteContent"></div></section><p class="help">鍵盤：← → 翻頁 · Home/End 首尾頁 · N 講稿 · G 總覽 · F 全螢幕</p></main></div>
<div id="gallery" class="modal hidden" role="dialog" aria-modal="true" aria-label="投影片總覽"><div class="modal-bar"><strong>選擇投影片（共 50 頁）</strong><button class="btn" id="closeGrid">✕ 關閉</button></div><div id="thumbs" class="thumbs"></div></div><script src="data.js"></script><script>
(()=>{'use strict';const slides=window.PYTHON_SLIDES||[], $=id=>document.getElementById(id);let current=0,showNotes=false;const n=slides.length;const readHash=()=>{let m=location.hash.match(/slide=(\d+)/);return m?Math.max(0,Math.min(n-1,+m[1]-1)):0};function render(){if(!n)return;let s=slides[current];$('slideImage').src=s.image;$('slideImage').alt='第 '+s.number+' 頁投影片';$('slideNum').textContent=s.number+' / '+n;$('count').textContent='第 '+s.number+' 頁 / 共 '+n+' 頁';$('prev').disabled=current===0;$('next').disabled=current===n-1;$('noteContent').textContent=s.note||'（本頁未提供講稿）';$('notesTitle').textContent='教師演講稿 · 第 '+s.number+' 頁';$('notes').classList.toggle('hidden',!showNotes);$('notesBtn').textContent=showNotes?'▤ 隱藏講稿':'▤ 顯示講稿';$('notesBtn').setAttribute('aria-pressed',String(showNotes));history.replaceState(null,'','#slide='+s.number)}function go(i){current=Math.min(n-1,Math.max(0,i));render()}function toggleNotes(){showNotes=!showNotes;render()}function gallery(open){$('gallery').classList.toggle('hidden',!open);document.body.style.overflow=open?'hidden':'';if(open){const target=$('thumbs');target.innerHTML='';slides.forEach((s,i)=>{let b=document.createElement('button');b.className='tile'+(i===current?' selected':'');b.innerHTML='<img loading="lazy" alt="" src="'+s.image+'"><span>第 '+s.number+' 頁</span>';b.onclick=()=>{go(i);gallery(false)};target.appendChild(b)})}}function fullscreen(){if(document.fullscreenElement){document.exitFullscreen?.()}else{$('stage').requestFullscreen?.()}}$('prev').onclick=()=>go(current-1);$('next').onclick=()=>go(current+1);$('first').onclick=()=>go(0);$('last').onclick=()=>go(n-1);$('notesBtn').onclick=toggleNotes;$('hideNotes').onclick=()=>{showNotes=false;render()};$('gridBtn').onclick=()=>gallery(true);$('closeGrid').onclick=()=>gallery(false);$('fullBtn').onclick=fullscreen;document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea'))return;if(!$('gallery').classList.contains('hidden')){if(e.key==='Escape')gallery(false);return}if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();go(current+1)}else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(current-1)}else if(e.key==='Home'){go(0)}else if(e.key==='End'){go(n-1)}else if(e.key.toLowerCase()==='n'){toggleNotes()}else if(e.key.toLowerCase()==='g'){gallery(true)}else if(e.key.toLowerCase()==='f'){fullscreen()}});window.addEventListener('hashchange',()=>{current=readHash();render()});current=readHash();render()})();
</script></body></html>
